name: CI

# Builds the site and checks internal links on every pull request.
# Deployment happens separately in deploy.yml on push to `source`.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      # Safari and older browsers cannot use the SVG favicon; rasterize it so
      # favicon.ico and the iOS home-screen icon match the generated SVG.
      - name: Rasterize favicon
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          rsvg-convert -w 180 -h 180 _site/favicon.svg -o _site/apple-touch-icon.png
          rsvg-convert -w 32  -h 32  _site/favicon.svg -o _site/favicon-32.png
          rsvg-convert -w 16  -h 16  _site/favicon.svg -o _site/favicon-16.png
          convert _site/favicon-16.png _site/favicon-32.png _site/favicon.ico
          rm _site/favicon-16.png _site/favicon-32.png

      - name: Check internal links
        run: |
          gem install html-proofer --no-document
          htmlproofer ./_site \
            --disable-external \
            --allow-missing-href \
            --ignore-missing-alt \
            --no-enforce-https
