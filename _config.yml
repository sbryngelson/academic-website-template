# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Richard Feynman"
title: "Professor of Physics"
institution: "California Institute of Technology"
email: richard@university.edu
photo: headshot.jpg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- leave blank to hide an icon)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=B7vSqZsAAAAJ"
  github: "https://github.com/"
  researchgate: "https://www.researchgate.net/"
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""  # e.g., "papers/cv.pdf"

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#1a7a6d"      # theme color; light and dark variants are derived automatically
dark_mode: true              # set to false to disable dark mode entirely
description: "Academic webpage of Dr. Richard Feynman"

# When deploying with the included GitHub Actions workflow these are filled
# in automatically from your Pages settings (user site, project site, or
# custom domain). Set them only if you host the site somewhere else.
url: ""
baseurl: ""

# Google Analytics -- paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: publications
  - name: talks
  - name: research
  - name: software
  - name: team
  - name: teaching
  - name: blog

# ============================================================
# STEP 5: Publications (assets/ref.bib)
# ============================================================
# Your name is bolded in the publication list. Write it exactly as it
# appears in the rendered list ("Last, F. M."); list the longest form first.
scholar:
  last_name: Feynman
  first_name: ["R. P.", "R."]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
permalink: /blog/:year/:title/

include:
  - _pages

sass:
  style: compressed
  quiet_deps: true                # hide warnings from vendored Bootstrap SCSS
  silence_deprecations: [import]  # Bootstrap 5.3 still uses @import
  sourcemap: development          # no .map file in production builds

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

# Repository files that should not be published to the site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - UPGRADING.md
  - LICENSE
  - setup.sh
  - images/screenshots
  - assets/javascript/bootstrap/__DO_NOT_MODIFY
  - vendor
  - .bundle
  - node_modules
