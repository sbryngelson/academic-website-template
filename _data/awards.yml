- name: Best Paper Award at the MIRASOL Workshop and MICCAI Travel Grant
  description:  BiomedLab research assistant Juan Pablo Barrientos Linares received the Best Paper Award at the MIRASOL Workshop during MICCAI 2025,
                held in Daejeon, South Korea. The recognition was granted for his work “Development and Evaluation of an AI-Driven Telemedicine System for Prenatal Healthcare”,
                selected as the top contribution to the workshop. He also received a MICCAI Travel Grant, which supported his participation at the conference and enabled the 
                presentation of this research at one of the leading global venues in medical image computing.
  year: 2025
  image: awards/bpa-mirasol.jpg
- name: Best Poster award at the Escuela de Primavera en Deep Learning and Travel Grant
  year: 2025
  description: The 2025 Escuela de Primavera en Deep Learning was an event aimed at graduate students and senior undergraduates in fields related to applied mathematics, machine learning, and data science. The experience provided evaluation methodologies, self-monitoring strategies, and model adaptation techniques, which strengthen research at BiomedLab and are applied in projects focused on supporting clinical diagnosis, developed at Universidad Galileo.
               Thanks to an international scholarship, MSc. Juan Pablo Rodríguez Illescas, research assistant at BiomedLab, represented Universidad Galileo at this meeting that brought together researchers and experts from all of Latin America.
               During the School, a poster session was held where MSc. Juan Pablo Rodríguez Illescas had the opportunity to present his work on AI-based Automatic Segmentation of Sinonasal Cavity in Cone-Beam Computed Tomography. This poster was awarded the Best Poster at the end of the session.
  image: awards/bpa-edp.jpg

