      url: "https://www.linkedin.com/posts/andrea-lara-_thanks-to-latin-america-bioimaging-labi-activity-7394365130278592512-VQOE"


- date: October, 2025
  title: "RISE MICCAI Features BiomedLab in Its New Podcast Series"
  summary: "RISE MICCAI launched its new podcast series with an episode highlighting BiomedLab’s work and regional impact."
  content: "RISE MICCAI released the first episode of its new podcast ‘Voices of RISE MICCAI,’ featuring Andrea Lara and spotlighting the development of Guatemala’s biomedical engineering program and BiomedLab’s contributions to AI-driven healthcare. The episode also highlights the role of NatalIA as an example of innovation emerging from the Global South, along with insights into community-focused research and regional scientific leadership."
  image: "networks/rise_logo.jpg"
  links:
    - text: "View post on LinkedIn"
      url: "https://www.linkedin.com/posts/rise-miccai_rooted-in-community-riseing-with-innovation-activity-7388461972280958976-5VHU"


- date: October, 2025
  title: "IDRC Highlights Global Health Research, Including NatalIA"
  summary: "IDRC showcased global initiatives powered by responsible AI, featuring NatalIA among examples from the Global South."
  content: "The International Development Research Centre (IDRC) highlighted impactful research initiatives supported across the Global South. Among them was BiomedLab’s work on NatalIA, recognized for improving maternal health in underserved communities through responsible and accessible AI. The post emphasized how collaborations funded by IDRC and partners are enabling solutions that strengthen health systems worldwide."
  image: "news/idrc.png"
  links:
