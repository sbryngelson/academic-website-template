      url: "https://www.linkedin.com/posts/idrc_research-impact-ugcPost-7379859204972519424-C2qT"

- date: October, 2025
  title: "BiomedLab at MICCAI 2025 and Looking Ahead to MICCAI 2026"
  summary: "BiomedLab participated at MICCAI 2025 in Korea, sharing research achievements and contributing to the upcoming MICCAI 2026 organization."
  content: "BiomedLab represented Universidad Galileo at MICCAI 2025 in Daejeon, Korea, thanks to key grants from the MICCAI Society and Global BioImaging. Our team presented the NatalIA project, which received the Best Paper Award at the MIRASOL Workshop. The post also highlighted continued support from CLIAS and IDRC, and the announcement of participation in the Organizing Committee for MICCAI 2026 in Abu Dhabi. These milestones underscore BiomedLab’s commitment to advancing medical imaging and AI research globally."
  image: "news/miccai2025.jpg"
  links:
