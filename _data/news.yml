
- date: 14 November, 2025
  title: "BiomedLab Participates in the LABI Meeting in Buenos Aires"
  summary: "BiomedLab joined the Latin America Bioimaging (LABI) Meeting to present NatalIA and strengthen collaborations in regional imaging research."
  content: "BiomedLab participated in the LABI Meeting in Buenos Aires, where our team presented the NatalIA project and contributed to discussions on advancing imaging research in Latin America. We were honored to collaborate with SIPAIM Society during the event and witness the signing of the Memorandum of Understanding between SIPAIM and LABI. This partnership reinforces regional cooperation and fosters new opportunities for joint initiatives in bioimaging."
  image: "news/labi.jpg"
