  about: Alberto Padovan is an Assistant Professor in the [Mechanical and Industrial Engineering Department](https://mie.njit.edu/) at 
    New Jersey Institute of Technology. He received his Ph.D. from Princeton University in Mechanical and Aerospace Engineering 
    in September 2022, and from 2022 to 2025 he was a Postdoctoral Research Associate in the 
    Aerospace Engineering Department at the University of Illinois Urbana-Champaign, where he was also 
    affiliated with the Center for Hypersonics and Entry Systems Studies. Alberto's research interests 
    lie at the intersection of fluid mechanics, applied dynamical systems theory, controls and data science. 



