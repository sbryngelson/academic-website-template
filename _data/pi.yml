- name: Andrea Lara, Ph.D. 
  slug: andrea-lara
  photo: /people/Andrea.jpg
  info: Andrea Lara, Ph.D, director of the Biomedical Engineering Institute at Universidad Galileo
  bio:  Andrea Lara holds a Bachelor's in Electronics from Universidad Galileo, a Master's in Biomedical Engineering from the University of Luebeck, 
        and a PhD in Biomedical Engineering from Graz University of Technology. She is currently the Director of the Biomedical Engineering Department at Universidad Galileo,
        where she leads Guatemala's first biomedical academic program and research laboratory. Her research focuses on applying artificial intelligence (AI) to 
        medical image analysis, particularly on developing tools that address the specific challenges faced by Guatemala's healthcare system. 
