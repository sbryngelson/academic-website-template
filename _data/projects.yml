# Orden de aparición
- key: natalia
  title: "NatalIA — AI-assisted obstetric ultrasound"
  media:
    type: youtube          # youtube | image
    youtube_id: "E8vFWk4uNYU"
    image: "/images/project/natalia.jpg"   # fallback/preview
    alt: "NatalIA project overview"
  summary: >
    NatalIA is a tele-ultrasound workflow that helps midwives and primary-care providers
    acquire fetal scans using blind sweeps with portable probes. Our platform uses AI to  
    assist with fetal plane identification, quality control, and asynchronous specialist review,
    lowering access barriers in low-resource settings.
  resources:
    - label: "Project page (CLIAS)"
      url: "https://clias.iecs.org.ar/proyectos/natalia/"


- key: cbct
  title: "CBCT — Image reconstruction & anatomical analytics"
  media:
    type: video
    file: "/videos/cbct.mp4"  # Use a placeholder image or actual project image
    alt: "CBCT project image"
  summary: >
    Diagnosing nasal and sinonasal disorders, including tumors, relies heavily on a detailed evaluation of the sinonasal cavity. However, the complex anatomy of the sinuses and the minimal intensity variations between air, soft tissue, and fluids pose significant challenges for accurate evaluation and surgery planning. This project focuses on developing an AI-based system capable of automatic segmentation of the sinonasal cavity in CBCT studies to improve clinical evaluation and the implementation of path-finding algorithms to aid in surgery planning.

- key: strokes
  title: "Strokes App — Prehospital stroke triage & decision support"
  media:
    type: image
    image: "/images/projects/strokes.png"  
    alt: "Strokes App placeholder"
  summary: >
    In resource-limited settings, access to specialists is often limited, and early stroke detection is extremely valuable, as in most cases the patient has only about 4.5 hours before stroke damage is irreversible. This project focuses on developing a system for early detection of strokes in low-resource settings, particularly within challenging public health environments. The project is currently being developed in collaboration with San Juan National Hospital and local emergency services.
  resources:
    - label: "Project page"
      url: "https://rescatecerebralgt.com"
- key: psm
  title: "Physiological Signal Monitoring and Analysis during Human Movement"
  media:
    type: image
    image: "/images/projects/psm.png"      
    alt: "PSM project placeholder"
  summary: >
    This work focuses on the development and application of technologies for monitoring physiological signals during human movement. In the laboratory, efforts are directed toward the integration of CW-NIRS optodes, embedded systems, and data processing methods to study how the body responds to different physical activities. The approach combines signal acquisition with kinematic gait analysis through state-of-the-art human pose estimation methods to explore relationships between physiological and biomechanical processes. This work supports research in biomedical engineering by promoting accessible, adaptable, and cost-effective solutions for real-world applications.

- key: farmahl
  title: "Interactions Web — Drug Interaction Search Platform"
  media:
    type: image
    image: "/images/projects/FarmaHL.png"
    alt: "FarmaHL project overview"
  summary: >
    web-based tool designed to streamline the process of retrieving and summarizing drug interaction information from trusted medical sources. The platform enables pharmacists and hospital staff to perform unified searches across multiple databases simultaneously, automatically generating concise summaries for each consulted source. By centralizing access and reducing redundant searches, this web helps minimize workflow bottlenecks and accelerates the preparation of clinical reports for hospitalized patients.

- key: modular
  title: Augmented Reality based Colonoscopy Simulator
  media:
    type: image
    image: "/images/projects/modular.png"
    alt: "ModuleAR project overview"
  summary: >
          A 3D-printed colonoscopy training simulator that uses augmented reality to help
          medical trainees recognize gastrointestinal pathologies. An endoscopic camera
          navigates the printed colon while AR markers overlay conditions such as polyps,
          Crohn’s disease, and tumors, enabling interactive quizzes and diagnostic learning
          in a low-cost, realistic environment.
  resources:
    - label: "Video Demo"
      url: "https://youtu.be/5LNDOfcHiiQ?si=hq2R4yG7SNopsJTL"