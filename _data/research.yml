- title: "A Tele-robot System with Mixed-Reality Interaction"
  image: "research/2022_telerobot.jpg"
  start_date: "2022-6"
  end_date: "2022-9"
  keywords:
    - Augmented reality
    - Teleoperation
    - User Interface
    - Robotics
  abstract: >
    This study describes the development of a tele-robot control system that utilizes a Mixed Reality headset, 
    (HoloLens 2), to remotely control Automated Guided Vehicles (Rover Pro). The system features a user-friendly 
    interface that offers three control methods: motion control, physical button control, and virtual button control.
