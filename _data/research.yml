- title: "System design of a human-centered AR HRI with cognition awareness"
  image: "research/2021_ARrobotcognition.jpg"
  start_date: "2019-11"
  end_date: "2021-10"
  keywords:
    - Human-Robot Interaction
    - Augmented Reality
    - Cognition Awareness
    - Cognitive Load Theory
    - Learning Science
  abstract: >
    This work proposed a novel system, HAR2bot, for path planning tasks in complex environments.
    The proposed system effectively balances the communication between the operator and the robot to minimize the cognitive
