- slug: julio-fajardo
  name: Julio Enrique Fajardo, Ph.D.
  photo: people/JulioFajardo.jpg
  bio:  Julio Enrique Fajardo, Ph.D., is the Subdirector of the Turing Laboratory
        and a Senior Researcher at the Biomedical Engineering Research Laboratory (BiomedLab)
        at Universidad Galileo. His work focuses on robotics for rehabilitation, artificial intelligence,
        computer vision, optimal and robust control, and biomedical instrumentation. He earned 
        his Ph.D. in Electrical Engineering from Universidade Estadual de Campinas (UNICAMP), 
        graduating Summa Cum Laude, and holds both a master's degree in Industrial Electronics 
        and a bachelor's degree in Electronic Engineering from Universidad Galileo.
  interests: ["Robotics", "Control Systems", "Computer Vision", "Biomedical Engineering", "Artificial Intelligence"]
  education:
    - { degree: "Ph.D. in Electrical Engineering", year: 2023, place: "UNICAMP, Brazil" }
    - { degree: "M.Sc. in Industrial Electronics", year: 2017, place: "Universidad Galileo, Guatemala" }
    - { degree: "B.Sc. in Electronic Engineering", year: 2012, place: "Universidad Galileo, Guatemala" }
  position: Senior Researcher
  email: julio.fajardo@galileo.edu
  google_scholar: https://scholar.google.com/citations?user=-G6WKocAAAAJ
  linkedin: https://www.linkedin.com/in/julioefajardo/


