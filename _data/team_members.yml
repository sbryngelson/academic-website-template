- name: Juan Pablo Rodríguez
  slug: juan-pablo-rodriguez
  photo: people/JuanRodriguez.jpg
  bio: He currently works as a research assistant at BiomedLab and as a teacher assistant at Galileo University. He graduated with honors with a Master’s degree in Biomedical Engineering and also with a Bachelor's degree in Computer Science Engineering. His current research focuses on processing and analysis of medical images, especially CBCT images, working to develop an AI-based system capable of automatic segmentation of upper airways to improve clinical evaluation. He also works in the development of an application aimed at the early detection of cerebrovascular events to assist emergency services and improve the patient's outcome.
  position: Research Assistant
