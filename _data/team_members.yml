- slug: juan-pablo-barrientos
  name: Juan Pablo Barrientos
  photo: people/JuanBarrientos.jpeg
  bio: Juan Pablo Barrientos is a research assistant in Biomedical Engineering at Universidad Galileo. 
       His research focuses on applying artificial intelligence to medical imaging, with a particular interest in developing computational tools for improving diagnostic 
       accuracy and healthcare accessibility in resource-limited settings. He holds an M.Sc. in Biomedical Engineering and a B.Sc. in Computer Science Engineering from Universidad Galileo, Guatemala.
       His work bridges computer science and biomedical applications, aiming to create innovative solutions that address critical challenges in global health.
