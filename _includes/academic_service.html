<style>
    .academic-service-container {
      margin-top: 1rem;
    }
    
    .service-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid #e9ecef;
    }
    
    .service-item:last-child {
      border-bottom: none;
    }
    
    .service-name {
      font-weight: 600;
      font-size: 1.05rem;
      color: #000000;
    }
    </style>
    
    {% if site.data.academic_service %}
    <div class="jumbotron">
      <h3>Academic service</h3>
      <div class="academic-service-container">
        {% for service in site.data.academic_service %}
          <div class="service-item">
            <div class="service-name">{{ service.name }}</div>
          </div>
        {% endfor %}
      </div>
    </div>
    {% endif %}
