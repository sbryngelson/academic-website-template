<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} - {{ site.name | escape }}{% else %}{{ site.name | escape }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.name | escape }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if site.photo %}<meta property="og:image" content="{{ site.photo | prepend: '/images/' | absolute_url }}">{% endif %}
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.name | escape }}{% endif %}">
  <meta name="twitter:description" content="{{ site.description }}">
  {% if site.photo %}<meta name="twitter:image" content="{{ site.photo | prepend: '/images/' | absolute_url }}">{% endif %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;0,8..60,800;1,8..60,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <!-- favicon.svg is generated from your initials + accent color (see favicon.svg).
       favicon.ico and apple-touch-icon.png are rasterized from it during deployment
       for browsers without SVG favicon support (Safari). -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.name | escape }}" href="{{ '/feed.xml' | absolute_url }}">

  <!-- Accent color from config; light/dark variants are derived in _sass/base/_variables.scss -->
  {% if site.accent_color %}
  <style>
    :root { --accent-base: {{ site.accent_color }}; }
  </style>
  {% endif %}

  {% unless site.dark_mode == false %}
  <!-- Dark mode: apply saved theme before paint to prevent flash -->
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-bs-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>
  {% endunless %}

  {% if jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}

  {% include mathjax.html %}

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{% if page.url == '/' %}WebSite{% else %}WebPage{% endif %}",
    "name": "{% if page.title %}{{ page.title | escape }}{% else %}{{ site.name | escape }}{% endif %}",
    "url": "{{ page.url | absolute_url }}",
    "description": "{{ site.description | escape }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.name | escape }}",
      "jobTitle": "{{ site.title | escape }}",
      "affiliation": {
        "@type": "Organization",
        "name": "{{ site.institution | escape }}"
      }{% if site.links.google_scholar and site.links.google_scholar != "" %},
      "sameAs": ["{{ site.links.google_scholar }}"{% if site.links.github and site.links.github != "" %}, "{{ site.links.github }}"{% endif %}{% if site.links.orcid and site.links.orcid != "" %}, "{{ site.links.orcid }}"{% endif %}]{% endif %}
    }
  }
  </script>
</head>
